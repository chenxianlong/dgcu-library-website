services:
  library:
    build:
      context: .
      args:
        PUBLIC_KEYSTATIC_GITHUB_REPO: ${PUBLIC_KEYSTATIC_GITHUB_REPO:-}
    image: dgcu-library:latest
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    ports:
      - "127.0.0.1:4321:4321"
